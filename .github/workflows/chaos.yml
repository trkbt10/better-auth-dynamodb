name: Chaos stress tests

on:
  schedule:
    - cron: "41 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Run 1,000 seeds per profile and 60 seeds per auth flow
        run: |
          mkdir -p artifacts
          bun run test:chaos:stress --reporter=default --reporter=json --outputFile.json=artifacts/chaos-stress.json
      - name: Save replay information and results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-stress-results
          path: artifacts/chaos-stress.json
          if-no-files-found: warn
          retention-days: 14
